paths:
  design_root: dsg
  build_root: bld
  render_root: dsg/openscad/render

design:
  include_externals: false

build_engine:
  engine: scons

openscad:
  common_flags:
    - --enable=object-function
  render_flags:
    - --render
  image_size: [1000, 700]
  design_image_size: [640, 480]

builds:
  - name: dep04-nested-discovery
    source: dsg/openscad/dep04-nested-discovery.scad
    output: bld/stl/dep04-nested-discovery.stl

  - name: dep05-independent-pins
    source: dsg/openscad/dep05-independent-pins.scad
    output: bld/stl/dep05-independent-pins.stl

externals:
  - name: lib.scad.mechint
    required_file: openscad/sliding-dovetail/sliding_dovetail.scad
  - name: lib.scad.util
    required_file: openscad/transform.scad

publication:
  production:
    source_branch: main
    build_branch: prod/bld
    verification_branch: prod/vrf

  development:
    pr_branch_prefix: dev/pr

  tags:
    pattern: "v*"

  release:
    branch_prefix: rel
    tag_pattern: "v*"
